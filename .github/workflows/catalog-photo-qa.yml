name: Catalog photo QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/local-catalog-photo.ts'
      - 'lib/product-photo.ts'
      - 'services/api.ts'
      - 'next.config.mjs'
      - 'tests/**'
      - 'types/catalog.ts'
      - 'public/products/**'
      - '.github/workflows/catalog-photo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        local_photos: ['0', '1']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CATALOG_LOCAL_PHOTOS_ENABLED: ${{ matrix.local_photos }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - run: corepack pnpm build
